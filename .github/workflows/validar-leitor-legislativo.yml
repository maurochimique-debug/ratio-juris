name: Validar leitor legislativo
on:
  push:
    paths:
      - 'api/artigo-oficial.mjs'
      - 'scripts/testar-extracao-artigos.mjs'
      - '.github/workflows/validar-leitor-legislativo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar-extracao:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validar sintaxe do extrator
        run: node --check api/artigo-oficial.mjs
      - name: Testar identificação exata de artigos
        run: node scripts/testar-extracao-artigos.mjs
